<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gửi cậu một điều 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-ittuis: center;
            justify-content: center;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffe0ec, #f5e6ff, #fff0f5);
            padding: 20px;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 15px 50px rgba(230, 100, 160, 0.2);
            border: 1px solid white;
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tuioji {
            font-size: 75px;
            margin-bottom: 15px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        h1 {
            color: #e75480;
            font-size: 27px;
            margin-bottom: 15px;
        }

        .message {
            color: #6d5261;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .yes {
            color: white;
            background: linear-gradient(135deg, #ff6b9d, #e75480);
            box-shadow: 0 5px 15px #ffb3cc;
        }

        .think {
            color: #d94f7b;
            background: #fff0f5;
            border: 1px solid #ffc4d6;
        }

        .footer {
            margin-top: 25px;
            color: #b58a9c;
            font-size: 12px;
        }

        .heart {
            position: fixed;
            bottom: -30px;
            z-index: 1;
            pointer-events: none;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        #result {
            display: none;
        }

        #result h1 {
            font-size: 30px;
        }

        .reset {
            margin-top: 15px;
            color: white;
            background: #e75480;
        }

        @media (max-width: 400px) {
            .card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }

        .buttons {
            position: relative;
            min-height: 110px;
        }

        .think {
            position: relative;
            z-index: 5;
            transition: left 0.2s ease, top 0.2s ease;
        }

        .think.running {
            position: fixed;
            width: 190px;
            z-index: 100;
        }
    </style>
</head>

<body>
    <main class="card">
        <section id="question">
            <div class="tuioji">💌</div>

            <h1>Gửi Trà My...</h1>

            <p class="message">
                tui có chuyện này muốn nói với bà lâu rồi.<br />
                Nói ra thì hơi ngại, nhưng mà... 🥹<br /><br />
                <strong>tui..... thích bà mất rồi!</strong><br />
                bà có muốn choa tui một cơ hội tìm hiểu bà không?
            </p>

            <div class="buttons">
                <button class="yes" onclick="accept()">
                    💗 Đồng ý, cho tui cơ hội!
                </button>

                <button class="think" id="thinkBtn">
                 💭 Để tui suy nghĩ đã...
                </button>
            </div>

            <p class="footer">
                Được tạo bằng một chút dũng cảm và rất nhiều tình cảm ♡
            </p>
        </section>

        <section id="result">
            <div class="tuioji">🥰</div>
            <h1>Year!!!</h1>

            <p class="message" id="resultMessage">
                Hôm nay chắc chắn là một ngày tuyệt vời rồi! 💖
            </p>

            <button class="yes" onclick="sendMessage()">
                💌 Nhắn tin cho tui
            </button>

            <button class="reset" onclick="goBack()">
                ↩ Quay lại
            </button>
        </section>
    </main>

    <script>
        // THAY THÔNG TIN CỦA BẠN Ở ĐÂY
        const myName = "tui";
        const myContact = ""; // Ví dụ: số điện thoại hoặc username

        function accept() {
            document.getEltuientById("question").style.display = "none";
            document.getEltuientById("result").style.display = "block";

            document.getEltuientById("resultMessage").innerHTML =
                `Cảm ơn bà đã cho <strong>${myName}</strong> một cơ hội! 💖<br><br>` +
                "Mình cứ từ từ tìm hiểu nhau nhé. 🌷";

            for (let i = 0; i < 35; i++) {
                setTimeout(createHeart, i * 80);
            }
        }

        const thinkBtn = document.getEltuientById("thinkBtn");

        function moveThinkButton() {
            thinkBtn.classList.add("running");

            const maxX = window.innerWidth - thinkBtn.offsetWidth - 10;
            const maxY = window.innerHeight - thinkBtn.offsetHeight - 10;

            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);

            thinkBtn.style.left = x + "px";
            thinkBtn.style.top = y + "px";
        }

        thinkBtn.addEventListener("mouseenter", moveThinkButton);
đ
        thinkBtn.addEventListener("touchstart", function (event) {
            event.preventDefault();
            moveThinkButton();
        }, { passive: false });

        thinkBtn.addEventListener("click", function (event) {
            event.preventDefault();
            moveThinkButton();
        });
        function sendMessage() {
            window.location.href = "https://fb.com/nyh04";
        }

        function goBack() {
            document.getEltuientById("result").style.display = "none";
            document.getEltuientById("question").style.display = "block";
        }

        function createHeart() {
            const heart = document.createEltuient("div");
            heart.className = "heart";
            heart.textContent = ["💗", "💕", "💖", "💘", "🌸"][
                Math.floor(Math.random() * 5)
            ];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = 15 + Math.random() * 20 + "px";
            heart.style.animationDuration = 3 + Math.random() * 4 + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.rtuiove(), 7000);
        }

        // Thỉnh thoảng tạo trái tim bay nền.
        setInterval(createHeart, 700);
    </script>
</body>

</html>
